<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4F46E5">
    <title>You're offline – Agency Hub</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: 100%;
            max-width: 26rem;
            padding: 2rem;
            text-align: center;
            background: #fff;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 1.25rem;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
        }
        .icon {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: #eef2ff;
            color: #4f46e5;
        }
        .icon svg { width: 1.75rem; height: 1.75rem; }
        h1 { margin: 0 0 0.5rem; font-size: 1.375rem; letter-spacing: -0.01em; }
        p { margin: 0; color: #475569; font-size: 0.9375rem; line-height: 1.5; }
        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.75rem 1.25rem;
            border: 0;
            border-radius: 0.75rem;
            background: #4f46e5;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }
        .hint { margin-top: 1.25rem; font-size: 0.8125rem; color: #64748b; }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #f1f5f9; }
            .card { background: #1e293b; border-color: rgba(148, 163, 184, 0.14); }
            p { color: #cbd5e1; }
            .icon { background: rgba(99, 102, 241, 0.18); color: #a5b4fc; }
            .hint { color: #94a3b8; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"/>
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>It looks like you've lost your internet connection. Agency Hub needs a connection to load your latest content and insights.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
        <p class="hint">We'll reconnect automatically as soon as you're back online.</p>
    </main>
    <script>
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
